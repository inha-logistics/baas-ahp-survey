<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>배터리 순환체계 추진과제 우선순위 평가 설문</title>
<meta name="description" content="전기차 시대 배터리 순환체계에 따른 고속도로 인프라 활용전략 수립 연구 · 전문가 AHP 설문">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2761; --navy2:#2A3670; --ice:#CADCFC; --ink:#14181F;
  --gray:#6B7484; --line:#E2E6EC; --alt:#F4F6F9; --bg:#FBFCFD;
  --hl:#C2410C; --ok:#0F766E; --warn:#B45309;
  --maxw:960px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65;
  font-size:15px; -webkit-text-size-adjust:100%;
  word-break:keep-all;          /* 한글 어절 단위로 줄바꿈 */
  overflow-wrap:break-word;     /* 칸보다 긴 단어만 예외적으로 분리 */
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 120px}

/* ── 상단 진행바 ── */
#topbar{position:sticky;top:0;z-index:50;background:rgba(251,252,253,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
#topbar .inner{max-width:var(--maxw);margin:0 auto;padding:10px 16px}
.pbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar>div{height:100%;background:var(--navy);width:0;transition:width .35s ease}
.pmeta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;
  font-size:12px;color:var(--gray)}
.pmeta b{color:var(--navy);font-weight:700}

/* ── 순위 고정 바 ── */
#rankbar{border-top:1px solid var(--line);background:rgba(240,245,246,.96);
  overflow:hidden;max-height:0;opacity:0;visibility:hidden;
  transition:max-height .28s ease,opacity .22s ease,visibility .22s}
#rankbar.show{max-height:72px;opacity:1;visibility:visible}
#rankbar.hide{max-height:0;opacity:0;visibility:hidden;border-top-color:transparent}
@media (prefers-reduced-motion:reduce){#rankbar{transition:none}}
#rankbar .inner{max-width:var(--maxw);margin:0 auto;padding:10px 16px;
  display:flex;gap:13px;align-items:center}
.rblab{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--navy);letter-spacing:.01em;line-height:1.3}
.rbitems{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:1px}
.rbitems::-webkit-scrollbar{display:none}
.rbi{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;
  font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.rbi b{color:#fff;background:var(--navy);font-weight:700;font-size:11px;
  border-radius:99px;padding:2px 7px;line-height:1.35}
.rbi.n1{border-color:var(--navy);background:#EAF3F4}
.rbi.na{color:var(--gray)}
@media (max-width:760px){
  #rankbar .inner{padding:8px 12px;gap:9px}
  .rblab{font-size:11px;max-width:52px}
  .rbi{font-size:12px;padding:5px 10px;gap:5px}
  .rbi b{font-size:10px;padding:2px 6px}
}

/* ── 카드 ── */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0}
.card.tight{padding:16px}
h1{font-size:25px;line-height:1.35;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;margin:22px 0 8px;font-weight:700;color:var(--navy)}
p{margin:0 0 10px}
.sub{color:var(--gray);font-size:13.5px}
.lead{font-size:14.5px;color:#3C4453}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* ── 표지 ── */
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:30px 24px;margin:16px 0}
.hero .org{font-size:12.5px;color:#8FA8D9;margin-bottom:14px}
.hero h1{color:#fff;font-size:26px}
.hero .tag{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;
  background:rgba(202,220,252,.16);color:var(--ice);font-size:12.5px;font-weight:500}
.notice{background:var(--alt);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  font-size:13px;color:#3C4453}
.notice b{color:var(--ink)}

/* ── 계층 도해 ── */
.hier{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.hier .lv{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--alt)}
.hier .lv .k{font-size:11.5px;color:var(--gray);font-weight:500}
.hier .lv .v{font-size:14px;font-weight:700;margin-top:1px}
.hier .lv .d{font-size:12.5px;color:var(--gray);margin-top:3px}
.hier .arw{text-align:center;color:var(--gray);font-size:13px;line-height:1}

/* ── 척도 안내 ── */
.scaleguide{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:12px 0}
.scaleguide div{border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;background:#fff}
.scaleguide .n{font-size:17px;font-weight:700;color:var(--navy)}
.scaleguide .l{font-size:11px;color:var(--gray);margin-top:2px}

/* ── 입력 ── */
label.fl{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
label.fl .req{color:var(--hl);margin-left:3px}
input[type=text],select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink)
}
input[type=text]:focus,select:focus{outline:2px solid var(--ice);outline-offset:0;border-color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.radios{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.radios label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:99px;padding:8px 13px;font-size:13.5px;cursor:pointer;background:#fff}
.radios label:has(input:checked){border-color:var(--navy);background:var(--ice);font-weight:700}
.radios input{accent-color:var(--navy);margin:0}

/* ── 쌍대비교 ── */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.qhead .qn{font-size:12px;font-weight:700;color:var(--navy);white-space:nowrap}
.pair{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:#fff;
  transition:border-color .2s,box-shadow .2s}
.pair.done{border-color:#BFD4D8;background:#FCFEFE}
.pair.miss{border-color:#E8B48A;background:#FFFCF9}
.pair .items{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;margin-bottom:12px}
.pair .it{font-size:14px;font-weight:500;line-height:1.45}
.pair .it.r{text-align:right}
.pair .it .idx{display:inline-block;font-size:11.5px;color:var(--gray);font-weight:700;margin-right:3px}
.pair .vs{font-size:11.5px;color:var(--gray);padding-top:2px;white-space:nowrap}

.sc{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.sc .side{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:var(--alt);color:var(--gray);font-size:10.5px;font-weight:700;padding:0 7px;text-align:center;line-height:1.2}
.sc .btns{flex:1 1 auto;display:grid;grid-template-columns:repeat(17,1fr)}
.sc .btns input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.sc .btns label{
  display:flex;align-items:center;justify-content:center;
  min-height:42px;font-size:12.5px;color:#4A5262;cursor:pointer;
  border-left:1px solid var(--line);background:#fff;user-select:none;position:relative
}
.sc .btns label:first-of-type{border-left:0}
.sc .btns label.eq{background:#EDF1F4;font-weight:700}
.sc .btns label:hover{background:var(--ice)}
.sc .btns input:checked+label,.sc .btns label.on{background:var(--navy);color:#fff;font-weight:700}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--gray);margin-top:5px;padding:0 2px}

/* 좁은 화면: 척도 크기 축소 */
@media(max-width:640px){
  .sc .side{font-size:9.5px;padding:0 4px}
  .sc .btns label{min-height:40px;font-size:11px}
  .pair{padding:13px}
  .pair .items{grid-template-columns:1fr;gap:4px}
  .pair .it.r{text-align:left}
  .pair .vs{display:none}
}

/* ── 순위 입력 ── */
.rank{margin:6px 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rank .rr{display:grid;grid-template-columns:1fr 74px;gap:0;border-top:1px solid var(--line);align-items:center}
.rank .rr:first-child{border-top:0}
.rank .rh{background:var(--alt);font-size:12px;font-weight:700;color:var(--gray)}
.rank .rc{padding:9px 12px;font-size:13.5px}
.rank .rc.n{border-left:1px solid var(--line);padding:6px}
.rank select{padding:7px 8px;font-size:13.5px;text-align:center}

/* ── CR 배지 ── */
.crbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--alt)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:12.5px;font-weight:700}
.badge.ok{background:#E0F2F1;color:var(--ok)}
.badge.no{background:#FEF3E2;color:var(--warn)}
.badge.na{background:#EEF1F4;color:var(--gray)}
.crbox .txt{font-size:12.5px;color:var(--gray);flex:1 1 200px}

/* ── 버튼 ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px;align-items:center}
button{font-family:inherit;font-size:14.5px;font-weight:700;border-radius:11px;border:1px solid var(--line);
  padding:13px 20px;background:#fff;color:var(--ink);cursor:pointer;transition:.15s}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff;flex:1}
button.pri:hover:not(:disabled){background:var(--navy2)}
button.gh{flex:0 0 auto}
.navhint{font-size:12px;color:var(--gray);text-align:center;margin-top:7px}

/* ── 결과 ── */
table.res{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.res th,table.res td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.res th{background:var(--navy);color:#fff;font-weight:700;font-size:12.5px}
table.res td.n{text-align:center;white-space:nowrap}
table.res tr.g td{background:var(--alt);font-weight:700}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;min-width:52px}
.bar>div{height:100%;background:var(--navy)}

.contact{margin-top:12px}
.contact div{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;font-size:12.5px}
.contact b{display:block;font-size:13px;margin-bottom:9px}
.contact span{color:var(--gray);display:block;line-height:1.65;padding:5px 0}
.contact span+span{border-top:1px solid #EEF2F3}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:80;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}
.hidden{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

input.bad{border-color:#C0392B;background:#FDF4F3}
input.bad:focus{box-shadow:0 0 0 3px rgba(192,57,43,.14)}
.hint{font-size:12.5px;color:#C0392B;margin-top:5px;min-height:0;display:none}
.hint.show{display:block}

.fig{margin:16px 0 10px;text-align:center}
.fig img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px}

.cap{font-size:12.5px;color:#5D7078;margin-top:8px}
.dim{font-size:12.5px;color:#5D7078}
.demo{border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0 12px;background:#FBFCFC}
.dhead{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:10px;align-items:center}
.dhead .dr{text-align:right}
.dhead .dvs{font-size:11.5px;color:#5D7078;font-weight:400}
.dscale{display:grid;grid-template-columns:44px repeat(17,minmax(0,1fr)) 44px;gap:2px;align-items:stretch}
.dscale .dend{font-size:10px;line-height:1.2;color:#5D7078;display:flex;align-items:center;justify-content:center;text-align:center}
.dscale .dc{border:1px solid var(--line);border-radius:5px;background:#fff;font-size:11.5px;color:#5D7078;
  display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;min-height:26px}
.dscale .dc.mid{background:#EEF2F3}
.dscale .dc.on{background:#14616E;color:#fff;border-color:#14616E;font-weight:700}
.dfoot{display:flex;justify-content:space-between;font-size:11px;color:#5D7078;margin-top:7px;padding:0 46px}
.scaletbl{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin:12px 0 6px}
.scaletbl div{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:7px 2px;border-bottom:1px solid #EAF0F1;font-size:13.5px;align-items:baseline}
.scaletbl b{color:#14616E}
@media (max-width:760px){
  .scaletbl{grid-template-columns:1fr}
  .dhead{grid-template-columns:1fr 1fr}
  .dhead .dvs{display:none}
  .demo{padding:10px}
  .dscale{grid-template-columns:26px repeat(17,minmax(0,1fr)) 26px;gap:1px}
  .dscale .dc{min-height:0;aspect-ratio:auto;height:17px;font-size:8.5px;border-radius:3px}
  .dscale .dend{font-size:8px}
  .dfoot{padding:0 27px;font-size:9.5px}
}

/* ── AHP 계층도 ── */
.tree{margin:16px 0 6px}
.trow{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start}
.tlv{padding-top:6px}
.tlv b{display:block;font-size:11.5px;font-weight:700;color:#14616E}
.tlv span{display:block;font-size:11px;color:#5D7078;margin-top:2px;line-height:1.35}
.tgoal{background:#16232B;color:#fff;border-radius:9px;padding:13px 16px;font-size:13.5px;font-weight:700;text-align:center}
.tconn{height:16px;margin-left:100px;border-left:1px solid #B9C8CC;width:0}
.tcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tbig{background:#14616E;color:#fff;border-radius:8px;padding:10px 8px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.35}
.tcol{display:grid;gap:6px;align-content:start}
.ttask{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 8px 8px 24px;position:relative;
  font-size:11.5px;line-height:1.45;color:#31434C;min-height:44px}
.tnum{position:absolute;left:7px;top:7px;font-size:10px;font-weight:700;color:#8FA3A9}
.tshort{display:none}
.tfootnote{margin:14px 0 0 100px;font-size:11.5px;color:#5D7078}

@media (max-width:760px){
  .trow{grid-template-columns:1fr;gap:6px}
  .tlv{padding-top:0;display:flex;gap:6px;align-items:baseline}
  .tlv span{margin-top:0}
  .tconn{display:none}
  .tgoal{font-size:12.5px;padding:10px 12px}
  .tcols{gap:5px}
  .tbig{font-size:10.5px;padding:7px 3px;border-radius:6px}
  .ttask{padding:6px 4px 6px 4px;font-size:9.5px;min-height:38px;text-align:center;line-height:1.35}
  .tnum{display:none}
  .tfull{display:none}
  .tshort{display:block}
  .tfootnote{margin-left:0;font-size:10.5px}
}

.rank select.empty{border-color:#E0A87A;background:#FFF9F3}
.rank select.bad{border-color:#C0392B;background:#FDF4F3;color:#C0392B;font-weight:700}
.rankmsg{margin-top:9px;font-size:12.5px}
.rankmsg.warn{color:#96590A}
.rankmsg.ok{color:#1E6B4F}
.crlist{margin-top:11px}
.crlt{font-size:12px;font-weight:700;color:#96590A;margin-bottom:6px}
.cri{font-size:12.5px;color:#31434C;padding:7px 9px;background:#fff;border:1px solid #EBD9C2;
  border-radius:6px;margin-bottom:5px;line-height:1.5}
.cri b{color:#96590A;margin-right:5px}
.cri .vs{color:#8FA3A9;font-size:11px;margin:0 3px}
.cri .fix{display:block;color:#96590A;font-size:11.5px;margin-top:3px}
.hint.warn{color:#96590A}
.hint.ok{color:#1E6B4F}


.notice.warn{background:#FDF6EC;border-color:#EBD9C2;color:#4A3A22}
.notice.warn b{color:#96590A}
.cbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.cbox>div{border:1px solid var(--line);border-radius:10px;padding:15px 16px;background:#fff}
.cbox b{display:block;font-size:14px;margin-bottom:9px}
.cbox .ln{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink);padding:4px 0}
.cbox .ln i{flex:0 0 34px;font-style:normal;font-size:11px;font-weight:700;color:var(--navy)}
.cbox a{color:var(--navy);text-decoration:none;word-break:break-all}

/* 쌍 목록 (n개 항목 → [i,j] 조합) */
function pairsOf(n){
  const out=[];
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) out.push([i,j]);
  return out;
}

/* ═══════════════ AHP 계산 ═══════════════ */
// 응답값 v: 양수면 A(i)가 v배 중요, 음수면 B(j)가 |v|배 중요, 1이면 동등
function matrixOf(n, get){
  const A = Array.from({length:n},()=>Array(n).fill(1));
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const v = get(i,j);
    if(v==null){ return null; }
    const a = v>0 ? v : 1/Math.abs(v);
    A[i][j]=a; A[j][i]=1/a;
  }
  return A;
}
// 기하평균법 가중치
function weightsOf(A){
  const n=A.length;
  const g=A.map(r=>Math.pow(r.reduce((p,x)=>p*x,1), 1/n));
  const s=g.reduce((a,b)=>a+b,0);
  return g.map(x=>x/s);
}
// 일관성비율
function crOf(A){
  const n=A.length;
  if(n<3) return 0;
  const w=weightsOf(A);
  let lam=0;
  for(let i=0;i<n;i++){
    let row=0;
    for(let j=0;j<n;j++) row += A[i][j]*w[j];
    lam += row/w[i];
  }
  lam/=n;
  const ci=(lam-n)/(n-1);
  return ci/(RI[n]||1.12);
}

function bigMatrix(){ return matrixOf(BIGS.length,(i,j)=>state.big[i+"-"+j]); }
function taskMatrix(b){ return matrixOf(TASKS[b].length,(i,j)=>state.task[b+"|"+i+"-"+j]); }

function answeredCount(){
  return Object.keys(state.big).length + Object.keys(state.task).length;
}
function totalCount(){
  return pairsOf(BIGS.length).length + BIGS.reduce((s,b)=>s+pairsOf(TASKS[b].length).length,0);
}

/* 최종 우선순위 */
function computeResult(){
  const BM=bigMatrix(); if(!BM) return null;
  const bw=weightsOf(BM);
  const rows=[]; const groups=[];
  BIGS.forEach((b,bi)=>{
    const TM=taskMatrix(b); if(!TM) return;
    const tw=weightsOf(TM);
    groups.push({big:b, w:bw[bi], cr:crOf(TM)});
    TASKS[b].forEach((t,ti)=>{
      rows.push({big:b, t:t.t, bw:bw[bi], tw:tw[ti], gw:bw[bi]*tw[ti]});
    });
  });
  rows.sort((a,b)=>b.gw-a.gw);
  rows.forEach((r,i)=>r.rank=i+1);
  return {bigWeights:bw, bigCR:crOf(BM), groups, rows};
}

/* 화면 안에 직접 그리는 확인창 (브라우저 대화상자가 막히는 환경 대비) */
function modal(opt){
  const old=document.getElementById("modal"); if(old) old.remove();
  const bg=el("div","modalbg"); bg.id="modal";
  const bx=el("div","modalbox");
  bx.appendChild(el("div","mh",esc(opt.title)));
  const body=el("div","mb"); body.innerHTML=opt.html||esc(opt.text||""); bx.appendChild(body);
  const ft=el("div","mf");
  const b2=el("button","mbtn ghost",opt.cancel||"취소");
  b2.onclick=()=>{ bg.remove(); if(opt.onCancel) opt.onCancel(); };
  const b1=el("button","mbtn"+(opt.danger?" danger":" primary"),opt.ok||"확인");
  b1.onclick=()=>{ bg.remove(); if(opt.onOk) opt.onOk(); };
  if(opt.cancel!==false) ft.appendChild(b2);
  ft.appendChild(b1);
  bx.appendChild(ft);
  bg.appendChild(bx);
  bg.onclick=(e)=>{ if(e.target===bg){ bg.remove(); if(opt.onCancel) opt.onCancel(); } };
  document.body.appendChild(bg);
  setTimeout(()=>b1.focus(),50);
}

/* 「응답 N / 60」 을 빠르게 3번 누르면 확인용 CR 표시가 켜지고 꺼집니다 */
let dbgTaps=0, dbgTimer=null;
function bindDebugToggle(){
  const m=document.querySelector("#topbar .pmeta");
  if(!m || m.dataset.dbgBound) return;
  m.dataset.dbgBound="1";
  m.style.cursor="default";
  m.addEventListener("click",(e)=>{
    if(e.target.closest("#btnReset")) return;
    dbgTaps++;
    clearTimeout(dbgTimer);
    dbgTimer=setTimeout(()=>{ dbgTaps=0; },1200);
    if(dbgTaps>=3){
      dbgTaps=0;
      DEBUG=!DEBUG;
      try{ localStorage.setItem("ahp_debug", DEBUG?"1":"0"); }catch(e){}
      const d=document.getElementById("dbg");
      if(!DEBUG && d) d.remove();
      syncDebug(); updateNav();
      toast(DEBUG ? "확인용 CR 표시를 켰습니다" : "확인용 CR 표시를 껐습니다");
    }
  });
}

function syncDebug(){
  if(!DEBUG) return;
  let d=document.getElementById("dbg");
  if(!d){
    d=document.createElement("span"); d.id="dbg"; d.className="dbgbar";
    const m=document.querySelector("#topbar .pmeta"); if(m) m.insertBefore(d, m.firstChild);
  }
  const out=[];
  if(state.step>=3 && state.step<=3+BIGS.length){
    const A = state.step===3 ? bigMatrix() : taskMatrix(BIGS[state.step-4]);
    out.push("이 단계 CR " + (A ? crOf(A).toFixed(3) : "–"));
  }
  const ab=bigMatrix(); if(ab) out.push("대분류 "+crOf(ab).toFixed(3));
  BIGS.forEach((b,i)=>{ const A=taskMatrix(b); if(A) out.push((i+1)+"군 "+crOf(A).toFixed(3)); });
  d.textContent = out.length ? ("확인용 · "+out.join(" / ")) : "";
}

function syncResetBtn(){
  const b=document.getElementById("btnReset"); if(!b) return;
  let has=false; try{ has=!!localStorage.getItem(LSKEY); }catch(e){}
  b.classList.toggle("hidden", !(has || answeredCount()>0 || state.step>0));
  b.onclick=resetAll;
}

function renderProgress(){
  const done=answeredCount(), tot=totalCount();
  $("#pdone").textContent=done;
  $("#pstep").textContent=STEPS[state.step]||"";
  const pct=state.step===0?1:(state.step===1?3:(state.step===2?6:Math.round(6+done/tot*94)));
  $("#pfill").style.width=Math.min(100,pct)+"%";
}

/* 하단 바는 단계 전환 시에만 다시 만든다.
   응답 중에는 updateNav()로 문구만 갱신한다 —
   버튼 노드를 교체하면 mousedown~mouseup 사이에 클릭이 사라진다. */
function renderNav(){
  const bar=$("#navbar"), hint=$("#navhint");
  bar.innerHTML=""; hint.textContent="";
  const last=STEPS.length-1;

  if(state.step>=1 && state.step<=last){
    const sv=el("button","gh save","진행 저장");
    sv.title="지금까지 응답한 내용을 파일로 내려받습니다";
    sv.onclick=downloadProgress;
    bar.appendChild(sv);
  }
  if(state.step>0 && state.step<=last){
    const b=el("button","gh","이전");
    b.onclick=()=>go(state.step-1);
    bar.appendChild(b);
  }
  if(state.step<last){
    const gate = (state.step===2 && !guideDone());
    const b=el("button","pri", state.step===0?"설문 시작":(gate?"끝까지 확인해 주세요":"다음"));
    b.id="btnNext"; b.disabled=gate;
    b.onclick=()=>{
      const m=validateStep();
      if(m){
        toast(m);
        if(state.step>=3 && state.step<=3+BIGS.length){
          const nn = state.step===3 ? BIGS.length : TASKS[BIGS[state.step-4]].length;
          const AA = state.step===3 ? bigMatrix() : taskMatrix(BIGS[state.step-4]);
          // 일관성비율이 상한을 넘어 막힌 경우에만 강도 표시를 켠다
          if(AA && crOf(AA)>0.20){
            flagShown=true;
            if(window.__crbox) window.__crbox.update();
            updateNav();
          }
          if(document.querySelector(".pair.flag")) gotoFirstFlag();
        }
        return;
      }

      // 방향은 맞으나 일관성비율이 기준을 넘는 경우 : 확인 후 진행
      if(state.step>=3 && state.step<=3+BIGS.length){
        const n = state.step===3 ? BIGS.length : TASKS[BIGS[state.step-4]].length;
        const A = state.step===3 ? bigMatrix() : taskMatrix(BIGS[state.step-4]);
        const cr = A ? crOf(A) : 0;
        if(cr>0.1 && cr<=0.20){
          modal({
            title:"응답 일관성 확인",
            html:"응답의 일관성이 기준에 조금 못 미칩니다.<br>"+
                 "항목 간 중요도 차이를 답하신 정도가 서로 조금씩 어긋납니다.<br><br>"+
                 "<b>조정하시겠습니까?</b>",
            ok:"이대로 넘어가기", cancel:"조정하기",
            onOk:()=>{ go(state.step+1); },
            onCancel:()=>{
              flagShown=true;
              if(window.__crbox) window.__crbox.update();
              updateNav(); gotoFirstFlag();
            }
          });
          return;
        }
      }
      go(state.step+1);
    };
    bar.appendChild(b);
  } else {
    const b=el("button","pri", state.sent?"제출 완료":"응답 제출");
    b.id="btnSend"; b.disabled=state.sent;
    b.onclick=submit;
    bar.appendChild(b);
  }
  updateNav();
}

/* 순위 고정 바 — 순위 지정을 마치고 쌍대비교 영역으로 내려오면 나타남 */
/* 조정이 필요한 첫 문항으로 이동하고 잠시 강조 */
function gotoFirstFlag(){
  const list=[...document.querySelectorAll(".pair.flag")];
  if(!list.length){ toast("특정 문항을 짚기 어렵습니다. 순위와 견주어 전체 응답을 다시 살펴봐 주세요."); return; }
  const first=list[0];
  first.scrollIntoView({behavior:"smooth",block:"center"});
  list.forEach(p=>{
    p.classList.remove("pulse"); void p.offsetWidth; p.classList.add("pulse");
    setTimeout(()=>p.classList.remove("pulse"),2400);
  });
  toast("조정이 필요한 문항 "+list.length+"개를 표시했습니다");
}

function renderRankBar(){
  const bar=$("#rankbar"), box=$("#rbitems");
  const inStep = state.step>=3 && state.step<=3+BIGS.length;
  if(!inStep){ bar.classList.add("hide"); bar.classList.remove("show");
    bar.setAttribute("aria-hidden","true"); box.innerHTML=""; return; }

  const isBig = state.step===3;
  const items = isBig ? BIGS : TASKS[BIGS[state.step-4]].map(t=>t.short||t.t);
  const n = items.length;
  const st = rankStatus(n);

  // 쌍대비교 카드가 화면 상단까지 올라왔는지
  const pc = document.getElementById("paircard");
  const reached = pc ? pc.getBoundingClientRect().top < 180 : false;
  const on = st.ok && reached;

  bar.classList.toggle("hide", !on);
  bar.classList.toggle("show", on);
  bar.setAttribute("aria-hidden", on?"false":"true");
  if(!on){ box.innerHTML=""; return; }

  const rk = rankValues(n);
  const order = items.map((name,i)=>({name, r:rk[i]?Number(rk[i]):99, i}))
                     .sort((a,b)=>a.r-b.r || a.i-b.i);
  box.innerHTML = order.map(o=>
    '<span class="rbi'+(o.r===1?" n1":"")+'"><b>'+o.r+'위</b>'+esc(o.name)+'</span>').join("");
}

let rbWatcher=null, rbObserver=null;
let flagShown=false, flagStep=-1;
let crLastStep=-1;
function watchRankBar(){
  stopRankBar();
  rbWatcher=()=>renderRankBar();
  document.addEventListener("scroll",rbWatcher,{passive:true,capture:true});
  window.addEventListener("resize",rbWatcher,{passive:true});
  if("IntersectionObserver" in window){
    const p=document.getElementById("paircard");
    if(p){
      rbObserver=new IntersectionObserver(rbWatcher,
        {threshold:[0,0.01,0.2,0.5,1], rootMargin:"-180px 0px 0px 0px"});
      rbObserver.observe(p);
    }
  }
}
function stopRankBar(){
  if(!rbWatcher) return;
  document.removeEventListener("scroll",rbWatcher,{capture:true});
  window.removeEventListener("resize",rbWatcher);
  if(rbObserver){ rbObserver.disconnect(); rbObserver=null; }
  rbWatcher=null;
}

function updateNav(){
  const hint=$("#navhint");
  if(state.step===2){
    hint.textContent = guideDone()
      ? "안내를 확인하셨습니다. 다음으로 넘어가 주십시오."
      : "아래로 내려 BaaS 개념 · 계층구조 · 응답 방법을 확인해 주십시오.";
    return;
  }
  if(state.step>=3 && state.step<=3+BIGS.length){
    const n = state.step===3 ? BIGS.length : TASKS[BIGS[state.step-4]].length;
    const rs = rankStatus(n);
    const miss = missingInStep();
    const A = state.step===3 ? bigMatrix() : taskMatrix(BIGS[state.step-4]);
    const cr = A ? crOf(A) : null;
    let msg="", block=false;
    if(rs.dup)            { msg="중요도 순위가 중복되었습니다"; block=true; }
    else if(rs.filled<rs.n){ msg="중요도 순위를 모두 지정해 주십시오 ("+rs.filled+" / "+rs.n+")"; block=true; }
    else if(miss>0)       { msg="쌍대비교 "+miss+"개 문항이 남았습니다"; block=true; }
    else {
      // 「다음」을 누르기 전에는 어떤 표시도 하지 않는다
      const bad=conflictPairs(n);
      const shown=bad.filter(x=> x.kind==="dir" || flagShown).length;
      if(shown){ msg="표시된 문항 "+shown+"개를 확인해 주십시오"; }
      else { msg="이 단계 응답을 모두 마쳤습니다"; }
      if(DEBUG && A) msg = "[확인용] CR "+crOf(A).toFixed(3)+" · "+msg;
    }
    hint.textContent=msg;
    hint.className = block ? "hint warn" : ((flagShown && A && conflictPairs(n).length) ? "hint warn" : "hint ok");
    const b=$("#btnNext"); if(b){ b.disabled=block; b.textContent=block?"조정이 필요합니다":"다음"; }
  } else {
    hint.textContent=""; hint.className="hint";
  }
}

function go(s){
  state.step=Math.max(0,Math.min(STEPS.length-1,s));
  save(); render();
  window.scrollTo({top:0,behavior:"instant"});
}

function missingInStep(){
  if(state.step===3){
    return pairsOf(BIGS.length).filter(([i,j])=>state.big[i+"-"+j]==null).length;
  }
  if(state.step>=4 && state.step<=3+BIGS.length){
    const b=BIGS[state.step-4];
    return pairsOf(TASKS[b].length).filter(([i,j])=>state.task[b+"|"+i+"-"+j]==null).length;
  }
  return 0;
}

/* 휴대전화 010-0000-0000 · 이메일 @ 포함 */
const RE_PHONE = /^(010-\d{4}|01[16789]-\d{3,4})-\d{4}$/;  // 010 은 11자리, 011·016~019 는 10~11자리
const RE_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

/** 숫자만 남겨 010-0000-0000 형태로 만듭니다. */
function fmtPhone(v){
  const d=String(v).replace(/\D/g,"").slice(0,11);
  if(d.length<4) return d;
  if(d.length<8) return d.slice(0,3)+"-"+d.slice(3);
  if(d.length<11) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
  return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
}

/* ── 안내 페이지 완독 확인 ── */
let guideWatcher=null;
function guideDone(){ return !!state.guideRead; }
function markGuideRead(){
  if(state.guideRead) return;
  state.guideRead=true; save(); updateNav();
  const b=$("#btnNext"); if(b){ b.disabled=false; b.textContent="다음"; }
}
function watchGuide(){
  stopGuide();
  const check=()=>{
    const doc=document.documentElement;
    const bottom = window.scrollY + window.innerHeight >= doc.scrollHeight - 96;
    if(bottom) markGuideRead();
  };
  guideWatcher=check;
  document.addEventListener("scroll",check,{passive:true,capture:true});
  window.addEventListener("resize",check,{passive:true});
  setTimeout(check,300);   // 화면이 짧아 스크롤이 없는 경우
}
function stopGuide(){
  if(!guideWatcher) return;
  document.removeEventListener("scroll",guideWatcher,{capture:true});
  window.removeEventListener("resize",guideWatcher);
  guideWatcher=null;
}

function validateStep(){
  if(state.step===1){
    const need=[["cat","기업 분류"],["org","기업명"],["dept","부서·직위"],["field","전문 분야"],["career","경력"],["name","성명"],["phone","휴대전화"],["email","이메일"]];
    for(const [k,label] of need){
      if(!state.info[k] || !String(state.info[k]).trim()) return label+"을(를) 입력해 주세요";
    }
    if(!RE_PHONE.test(String(state.info.phone).trim()))
      return "휴대전화를 01#-####-#### 형식으로 입력해 주세요";
    if(!RE_EMAIL.test(String(state.info.email).trim()))
      return "이메일 형식이 올바르지 않습니다. @ 를 포함한 주소를 입력해 주세요";
    if(!state.info.agree)
      return "개인정보 수집·이용에 동의해 주셔야 다음 단계로 넘어갈 수 있습니다";
    return null;
  }
  if(state.step===2 && !guideDone()){
    return "안내 내용을 끝까지 확인해 주세요";
  }
  if(state.step>=3 && state.step<=3+BIGS.length){
    const n = state.step===3 ? BIGS.length : TASKS[BIGS[state.step-4]].length;
    const rs = rankStatus(n);
    if(rs.dup)              return "중요도 순위에 같은 값이 중복되었습니다";
    if(rs.filled<rs.n)      return "중요도 순위를 모두 지정해 주십시오";
    const m0=missingInStep();
    if(m0>0)                return "응답하지 않은 문항이 "+m0+"개 있습니다";
    const dir0=conflictPairs(n).filter(x=>x.kind==="dir");
    if(dir0.length)         return "순위와 방향이 반대인 문항 "+dir0.length+"개를 수정해 주십시오";
    const A0 = state.step===3 ? bigMatrix() : taskMatrix(BIGS[state.step-4]);
    if(A0 && crOf(A0)>0.20)  return "응답 간 어긋남이 커서 이대로 진행할 수 없습니다. 표시된 문항을 조정해 주십시오";
    return null;   // CR 초과는 다음 단계에서 확인 후 진행
  }
  if(state.step>=3){
    const m=missingInStep();
    if(m>0) return "응답하지 않은 문항이 "+m+"개 있습니다";
  }
  return null;
}

/* CR 표시 박스 */
function answeredInStep(){
  if(state.step===3) return Object.keys(state.big).length;
  const b=BIGS[state.step-4];
  return Object.keys(state.task).filter(k=>k.indexOf(b+"|")===0).length;
}

function crBox(getMatrix, n){
  const box=el("div","crbox");
  const bd=el("span","badge na","CR 산출 대기");
  const tx=el("div","txt","모든 문항에 응답하면 일관성비율(CR)이 계산됩니다.");
  const ls=el("div","crlist");
  box.appendChild(bd); box.appendChild(tx); box.appendChild(ls);
  box.update=()=>{
    ls.innerHTML="";
    // 이전 경고 제거
    document.querySelectorAll(".pair.flag").forEach(p=>{
      p.classList.remove("flag","flagdir","flagdeg");
      const t=p.querySelector(".pairwarn"); if(t) t.remove();
    });
    box.style.display="none";
    const A=getMatrix();
    if(!A){
      box.classList.add("waiting");
      const done = answeredInStep(), need = n*(n-1)/2;
      bd.className="badge na"; bd.textContent="";
      tx.textContent = "쌍대비교 "+done+" / "+need+" 문항 응답";
      return;
    }
    box.classList.remove("waiting");
    const cr=crOf(A);
    const ok=cr<=0.1;
    bd.className="badge "+(ok?"ok":"no");
    bd.textContent="CR "+cr.toFixed(3)+(ok?" · 양호":" · 기준 초과");
    if(ok){
      tx.textContent="응답이 일관되게 유지되었습니다. 다음 단계로 진행해 주십시오.";
      return;
    }
    tx.textContent="일관성비율이 0.1을 초과했습니다. 표시된 문항을 순위와 맞게 조정하시면 정확도가 높아집니다. 그대로 진행하실 수도 있습니다.";
    // 지정한 순위와 방향이 어긋난 문항 찾기
    const bad=conflictPairs(n);
    if(bad.length){
      // 부호·강도는 항상, 가중치 기반 진단은 「다음」을 눌러 조정을 택한 뒤에만
      bad.filter(x=> x.kind==="dir" || flagShown ).forEach(x=>{
        const p=document.querySelector('.pair[data-key="'+x.key+'"]');
        if(p){
          p.classList.add("flag", x.kind==="dir"?"flagdir":"flagdeg");
          const w=el("div","pairwarn"+(x.kind==="dir"?" dir":""));
          w.innerHTML="<b>"+(x.kind==="dir"?"방향 확인":"강도 확인")+"</b>"+x.msg;
          p.appendChild(w);
        }
      });
    }
  };
  box.update();
  window.__crbox=box;
  return box;
}

/* 지정한 순위와 맞지 않는 문항 찾기 — 방향과 강도를 함께 점검 */
function conflictPairs(n){
  const isBig = state.step===3;
  const items = isBig ? BIGS : TASKS[BIGS[state.step-4]].map(t=>t.short||t.t);
  const store = isBig ? state.big : state.task;
  const key   = isBig ? "" : BIGS[state.step-4]+"|";
  const rk    = rankValues(n).map(v=>v?Number(v):null);
  const out=[]; let q=0;

  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    q++;
    const v = store[key+i+"-"+j];
    if(v==null || rk[i]==null || rk[j]==null || rk[i]===rk[j]) continue;

    const hiIdx = rk[i]<rk[j] ? i : j;          // 상위 순위 쪽
    const loIdx = rk[i]<rk[j] ? j : i;
    const gap   = Math.abs(rk[i]-rk[j]);        // 순위 차이 1~4
    const 권장  = [0,3,4,6,8][gap] || 3;         // 1칸差→③, 2칸→④, 3칸→⑥, 4칸→⑧
    const 강도  = Math.abs(v);                   // 응답한 강도 1~9
    const dirA  = v > 1;                        // 응답이 A(i)를 더 중요하다고 했는지
    const rankA = rk[i] < rk[j];

    const tag = (idx)=> "<b>"+rk[idx]+"위</b> "+esc(items[idx]);
    const pkey = key+i+"-"+j;

    if(v === 1){
      out.push({q, key:pkey, kind:"dir",
        html: tag(hiIdx)+" <span class='vs'>vs</span> "+tag(loIdx),
        msg: "순위가 다른데 «같다»로 답하셨습니다"});
    } else if(dirA !== rankA){
      out.push({q, key:pkey, kind:"dir",
        html: tag(hiIdx)+" <span class='vs'>vs</span> "+tag(loIdx),
        msg: "지정한 순위와 방향이 반대입니다"});
    } else if(Math.abs(강도-권장) >= 2){
      out.push({q, key:pkey, kind:"deg",
        html: tag(hiIdx)+" <span class='vs'>vs</span> "+tag(loIdx),
        msg: "순위 차이는 "+gap+"칸인데 "+CIRC[강도]+"로 답하셨습니다 · 차이에 비해 "+(강도<권장?"약합니다":"강합니다")});
    }
  }
  // 순위로는 설명되지 않는 경우 : 도출된 가중치와 가장 어긋난 문항을 찾는다
  if(!out.length){
    const A = isBig ? bigMatrix() : taskMatrix(BIGS[state.step-4]);
    if(A && crOf(A)>0.1){
      const w=weightsOf(A), dev=[]; let qq=0;
      for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
        qq++;
        const d=Math.abs(Math.log(A[i][j]) - Math.log(w[i]/w[j]));
        dev.push({q:qq, i, j, d});
      }
      dev.sort((a,b)=>b.d-a.d);
      dev.slice(0,2).forEach(x=>{
        const hi = rk[x.i]<rk[x.j] ? x.i : x.j, lo = rk[x.i]<rk[x.j] ? x.j : x.i;
        const tag=(k)=> "<b>"+rk[k]+"위</b> "+esc(items[k]);
        out.push({q:x.q, key:key+x.i+"-"+x.j, kind:"wgt",
          html: tag(hi)+" <span class='vs'>vs</span> "+tag(lo),
          msg: "다른 문항의 응답과 견주면 이 문항의 강도가 어긋납니다"});
      });
    }
  }
  // 방향 오류를 먼저 보여준다
  return out.sort((a,b)=> (a.kind===b.kind ? a.q-b.q : (a.kind==="dir"?-1:1)));
}

/* 중요도 순위 입력 (필수) */
function rankStoreKey(){ return state.step===3 ? "big" : BIGS[state.step-4]; }
function rankValues(n){
  const key=rankStoreKey(), store=(state.step===3?state.rankBig:state.rankTask);
  return Array.from({length:n},(_,i)=>store[key+"_"+i]||"");
}
function rankStatus(n){
  const v=rankValues(n);
  const filled=v.filter(x=>x).length;
  const dup=new Set(v.filter(x=>x)).size!==filled;
  return {filled, n, dup, ok: filled===n && !dup};
}
function rankTable(items, store, key){
  const t=el("div","rank");
  const h=el("div","rr");
  h.appendChild(el("div","rc rh","평가항목"));
  h.appendChild(el("div","rc rh n","중요도 순위"));
  t.appendChild(h);
  const sels=[];
  const paint=()=>{
    const used={};
    sels.forEach(s=>{ if(s.value) used[s.value]=(used[s.value]||0)+1; });
    sels.forEach(s=>{
      s.classList.toggle("bad", !!(s.value && used[s.value]>1));
      s.classList.toggle("empty", !s.value);
    });
    const st=rankStatus(items.length);
    const msg=$("#rankmsg");
    if(msg){
      msg.textContent = st.dup ? "같은 순위가 중복되었습니다. 1~"+st.n+"위를 하나씩 배정해 주십시오."
        : (st.filled<st.n ? "순위를 모두 지정해 주십시오. ("+st.filled+" / "+st.n+")" : "순위 지정이 완료되었습니다.");
      msg.className = "rankmsg " + (st.ok ? "ok" : "warn");
    }
    if(window.__crbox) window.__crbox.update();
    renderRankBar(); updateNav(); syncDebug();
  };
  items.forEach((name,i)=>{
    const r=el("div","rr");
    r.appendChild(el("div","rc","<span style='color:var(--gray);font-weight:700;font-size:11.5px'>"+NUM[i]+"</span> "+esc(name)));
    const c=el("div","rc n");
    const s=el("select");
    s.appendChild(el("option",null,"–"));
    for(let k=1;k<=items.length;k++){ const o=el("option",null,String(k)+"위"); o.value=k; s.appendChild(o); }
    if(store[key+"_"+i]) s.value=store[key+"_"+i];
    s.onchange=()=>{ store[key+"_"+i]=s.value; save(); paint(); };
    sels.push(s);
    c.appendChild(s); r.appendChild(c);
    t.appendChild(r);
  });
  const wrap=el("div");
  wrap.appendChild(t);
  wrap.appendChild(el("div","rankmsg warn","")).id="rankmsg";
  setTimeout(paint,0);
  return wrap;
}

/* ═══════════════ 진행 저장 · 이어하기 ═══════════════ */
function saveFileName(){
  const nm=(state.info && state.info.name) ? state.info.name.replace(/[^\w가-힣]/g,"") : "응답";
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return "AHP_진행저장_"+nm+"_"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+".json";
}
function downloadProgress(){
  const done=answeredCount();
  const pack={ _type:"BAAS_AHP_PROGRESS", _ver:1, savedAt:new Date().toISOString(), answered:done, state:state };
  const blob=new Blob([JSON.stringify(pack,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=saveFileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("진행 상황을 저장했습니다 ("+done+" / 60문항)");
}
function loadProgress(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      const s=(p && p._type==="BAAS_AHP_PROGRESS") ? p.state : p;
      if(!s || typeof s!=="object" || !("big" in s) || !("task" in s))
        throw new Error("형식이 맞지 않습니다");
      if(s.sent) throw new Error("이미 제출이 끝난 파일입니다");
      Object.assign(state, s);
      save(); render();
      toast("이전 응답을 불러왔습니다 ("+answeredCount()+" / 60문항)");
      window.scrollTo({top:0,behavior:"instant"});
    }catch(e){
      modal({title:"파일을 읽을 수 없습니다",
        html:"이 설문에서 내려받은 진행 저장 파일(.json)이 맞는지 확인해 주십시오.",
        ok:"확인", cancel:false});
    }
  };
  r.readAsText(file);
}

  c.appendChild(el("h1",null,"Ⅰ. 응답자 일반현황"));
  c.appendChild(el("p","sub","분석 결과의 신뢰성 확보를 위한 항목입니다. 휴대전화와 이메일은 전문가 활용비 지급 안내에만 사용되며, 분석에는 소속 유형과 경력만 반영됩니다."));

  const lab=el("label","fl","기업 분류<span class='req'>*</span>");
  c.appendChild(lab);
  const rs=el("div","radios");
  ["정부·공공기관","연구소(기업 부설 연구소 포함)","산업계(대기업/중견/중소기업)","대학교","기타"].forEach((v,i)=>{
    const id="cat"+i;
    const l=el("label");
    l.innerHTML="<input type='radio' name='cat' id='"+id+"' value='"+esc(v)+"'"+(state.info.cat===v?" checked":"")+"><span>"+esc(v)+"</span>";
    l.querySelector("input").onchange=e=>{ state.info.cat=e.target.value; save(); };
    rs.appendChild(l);
  });
  c.appendChild(rs);

  const fields=[
    ["org","기업·기관명",true,"",""],
    ["dept","부서 · 직위",true,"",""],
    ["field","전문 분야",true,"",""],
    ["career","경력 (예: 12년)",true,"",""],
    ["name","성명",true,"",""],
    ["phone","휴대전화",true,"01#-####-####","tel"],
    ["email","이메일",true,"name@example.com","email"]
  ];
  const g=el("div","grid2");
  fields.forEach(([k,label,req,ph,mode])=>{
    const box=el("div");
    box.appendChild(el("label","fl",esc(label)+(req?"<span class='req'>*</span>":"")));
    const i=el("input"); i.type="text"; i.value=state.info[k]||""; i.placeholder=ph||"";
    if(mode==="tel"){ i.inputMode="numeric"; i.maxLength=13; }
    if(mode==="email"){ i.inputMode="email"; i.autocapitalize="off"; i.spellcheck=false; }
    const hint=el("div","hint");
    const check=()=>{
      const v=String(i.value).trim();
      let bad=false, msg="";
      if(mode==="tel" && v)   { bad=!RE_PHONE.test(v);  msg="01#-####-#### 형식으로 입력해 주세요"; }
      if(mode==="email" && v) { bad=!RE_EMAIL.test(v);  msg="@ 를 포함한 주소를 입력해 주세요"; }
      i.classList.toggle("bad",bad);
      hint.textContent = bad ? msg : "";
      hint.classList.toggle("show",bad);
    };
    i.oninput=()=>{
      if(mode==="tel"){
        const p=i.selectionStart, before=i.value;
        i.value=fmtPhone(i.value);
        if(i.value.length>before.length) i.setSelectionRange(i.value.length,i.value.length);
        else i.setSelectionRange(Math.min(p,i.value.length),Math.min(p,i.value.length));
      }
      state.info[k]=i.value; save(); check();
    };
    i.onblur=check;
    box.appendChild(i);
    if(mode) { box.appendChild(hint); check(); }
    g.appendChild(box);
  });
  c.appendChild(g);

  /* 개인정보 수집·이용 동의 (필수) */
  const pv=el("div","privacy");
  pv.innerHTML =
    "<div class='pvh'>개인정보 수집 및 이용 안내</div>"+
    "<div class='pvb'>「개인정보 보호법」 제15조에 따라 아래와 같이 수집·이용합니다.</div>"+
    "<ul class='pvl'>"+
    "<li><b>수집 항목</b> 성명 · 소속 · 부서·직위 · 전문분야 · 경력 · 휴대전화 · 이메일</li>"+
    "<li><b>이용 목적</b> 응답자 확인과 소속 유형별 구분, 개별 식별이 불가능한 형태의 통계 분석, 전문가 활용비 지급 안내</li>"+
    "<li><b>보유 기간</b> 연구 종료 및 지급 처리 완료 시 지체 없이 파기 (제3자 제공 없음)</li>"+
    "</ul>"+
    "<div class='pvn'>※ 동의를 거부하실 수 있으나, 이 경우 조사 참여가 제한됩니다.</div>";
  const agLab=el("label","agree");
  const agCb=el("input"); agCb.type="checkbox"; agCb.id="agreeChk";
  agCb.checked = !!state.info.agree;
  agCb.onchange=()=>{ state.info.agree = agCb.checked; save(); updateNav();
    agLab.classList.toggle("on", agCb.checked); };
  agLab.appendChild(agCb);
  agLab.appendChild(el("span",null,"위 내용을 확인하였으며, 개인정보 수집·이용에 동의합니다. <b class='req'>(필수)</b>"));
  agLab.classList.toggle("on", agCb.checked);
  pv.appendChild(agLab);
  c.appendChild(pv);

  f.appendChild(c);
  return f;
}

  Object.entries(state.task).forEach(([k,v])=>{ flatTask[k]=v; });

    sid: state.sid,
    submittedAt: new Date().toISOString(),
    startedAt: state.startedAt,
    userAgent: navigator.userAgent,
    info: state.info,
    bigPairs: state.big,
    taskPairs: state.task,
    rankBig: state.rankBig,
    rankTask: state.rankTask,
    bigWeights: R ? R.bigWeights : null,
    bigCR: R ? R.bigCR : null,
    groupCR: R ? R.groups.map(g=>({big:g.big,w:g.w,cr:g.cr})) : null,
    result: R ? R.rows.map(r=>({
      rank:r.rank, big:r.big, task:r.t,
      bigW:r.bw, taskW:r.tw, weight:r.gw
    })) : null
  };
}

async function submit(){
  const btn=$("#btnSend");
  if(ENDPOINT.indexOf("PASTE_YOUR")===0){
    toast("전송 주소가 설정되지 않았습니다. 관리자에게 문의해 주세요.");
    return;
  }
  if(location.protocol==="file:"){
    toast("파일로 직접 열면 전송이 차단됩니다. 웹 주소(https)로 접속해 주세요.");
    return;
  }
  btn.disabled=true; btn.innerHTML="<span class='spin'></span> 전송 중…";
  const body=JSON.stringify(payload());

  // 1차 : 응답을 읽어 실제 저장 여부를 확인
  let ok=false, msg="";
  try{
    const res=await fetch(ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body, redirect:"follow"
    });
    const txt=await res.text();
    try{ ok = !!JSON.parse(txt).ok; }
    catch(_){ ok=false; msg="서버 응답을 해석할 수 없습니다"; }
  }catch(e){
    // 2차 : 응답을 읽을 수 없는 환경 — 전송만 시도 (같은 sid 는 서버에서 중복 저장하지 않음)
    try{
      await fetch(ENDPOINT,{method:"POST",mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},body});
      ok=true;
    }catch(e2){ ok=false; msg="네트워크 연결을 확인해 주세요"; }
  }

  if(!ok){
    btn.disabled=false; btn.textContent="다시 제출";
    toast("전송에 실패했습니다. "+(msg||"잠시 후 다시 시도해 주세요."));
    return;
  }

  state.sent=true; save();
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  $("#app").innerHTML=""; $("#app").appendChild(viewDone());
  $("#navbar").innerHTML=""; $("#navhint").textContent="";
  document.querySelector(".nav").classList.add("hidden");
  document.querySelector("#rankbar").classList.add("hide");
  document.querySelector("#rankbar").classList.remove("show");
  $("#pfill").style.width="100%"; $("#pstep").textContent="응답 완료";
  $("#pdone").parentElement.textContent="60문항 응답 완료";
  window.scrollTo({top:0,behavior:"instant"});
}

/* ═══════════════ 메인 ═══════════════ */
function render(){
  const app=$("#app"); app.innerHTML="";
  const s=state.step;
  if(s===0) app.appendChild(viewIntro());
  else if(s===1) app.appendChild(viewInfo());
  else if(s===2) app.appendChild(viewGuide());
  else if(s===3) app.appendChild(viewBig());
  else if(s>=4 && s<=3+BIGS.length) app.appendChild(viewTasks(s-4));
  else app.appendChild(viewReview());
  if(s!==flagStep){ flagShown=false; flagStep=s; }
  renderProgress(); renderNav(); renderRankBar(); syncResetBtn(); bindDebugToggle(); syncDebug();
  if(s===2) watchGuide(); else stopGuide();
  if(s>=3 && s<=3+BIGS.length) watchRankBar(); else stopRankBar();
}

(function init(){
  if(location.protocol==="file:"){
    const w=document.getElementById("localwarn");
    if(w) w.classList.remove("hidden");
  }
  const resumed=load();
  render();
  if(resumed) setTimeout(()=>toast("이전에 작성하던 응답을 불러왔습니다"),400);
})();
</script>
